spring.application.name=backend

# 開発用 PostgreSQL（../compose.yaml で起動）
spring.datasource.url=jdbc:postgresql://localhost:5432/kanban
spring.datasource.username=kanban
spring.datasource.password=kanban

# テーブルは Flyway（src/main/resources/db/migration）で作るので、JPA には作らせない
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

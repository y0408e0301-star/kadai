# 開発用の PostgreSQL。kadai フォルダで `docker compose up -d` を実行して起動する
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:

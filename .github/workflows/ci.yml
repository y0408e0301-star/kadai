# コードチェックとテストを、Pull Request と main への push ごとに GitHub 上で実行する。
# 手元で同じことをするコマンドは README「テストとコードチェック」
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: 画面（lint・型チェック・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: API サーバー（書式・静的解析・テスト）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # テストは PostgreSQL を使うので、compose.yaml と同じ設定で起動しておく
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: kanban
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

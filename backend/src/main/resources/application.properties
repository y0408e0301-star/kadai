spring.application.name=backend

# 接続先の PostgreSQL。環境変数 DB_URL / DB_USERNAME / DB_PASSWORD があればそちらを使う
# （公開先のサーバーで使う）。なければ開発用の DB（../compose.yaml で起動）につなぐ
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kanban}
spring.datasource.username=${DB_USERNAME:kanban}
spring.datasource.password=${DB_PASSWORD:kanban}

# テーブルは Flyway（src/main/resources/db/migration）で作るので、JPA には作らせない
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# コードチェックとテストを、Pull Request と main への push ごとに GitHub 上で実行する。
# 手元で同じことをするコマンドは README「テストとコードチェック」
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: 画面（lint・ユニットテスト・型チェック・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: API サーバー（書式・静的解析・テスト）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # テスト用の PostgreSQL は Testcontainers が Docker で起動する（ubuntu-latest には Docker が入っている）
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  e2e:
    name: E2E テスト（Playwright）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 手元と同じく、DB（5432）・API サーバー（8080）・画面（5173）をランナーの中で起動し、画面を Edge で操作する。
    # Edge は ubuntu-latest に入っている（playwright.config.ts の channel: msedge）
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # compose.yaml の db には healthcheck がないので、接続を受け付けるまで待つ
      - name: DB を起動する（5432）
        run: |
          docker compose up -d db
          for i in $(seq 60); do
            docker compose exec -T db pg_isready -h 127.0.0.1 -U kanban -d kanban && exit 0
            sleep 1
          done
          exit 1
      # テスト・書式・静的解析は backend ジョブで実行するので、ここでは jar を作るだけ。
      # 手元の E2E と同じく dev プロファイル（テストデータ入り）で起動する
      - name: API サーバーを起動する（8080）
        working-directory: backend
        run: |
          ./mvnw -B -q -DskipTests -Dspring-javaformat.skip=true package
          nohup java -jar target/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev > ../api.log 2>&1 &
          curl -sf --retry 60 --retry-delay 1 --retry-all-errors http://localhost:8080/api/health
      - run: npm ci
        working-directory: frontend
      # 5173 が使えないときに別のポートで起動しないよう --strictPort
      - name: 画面を起動する（5173）
        working-directory: frontend
        run: |
          nohup npm run dev -- --strictPort > ../vite.log 2>&1 &
          curl -sf -o /dev/null --retry 30 --retry-delay 1 --retry-all-errors http://localhost:5173/
      - run: npm run test:e2e
        working-directory: frontend
      # 失敗したテストの操作の記録（npx playwright show-trace で開く）と、サーバーのログ
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: |
            frontend/test-results/
            api.log
            vite.log
          if-no-files-found: ignore
          retention-days: 7

  terraform:
    name: Terraform（書式・構文・lint）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    # AWS には接続しない（plan・apply は手元で行う）
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -diff -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init
        env:
          # プラグインを GitHub から取るときの回数制限を避ける
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --format=compact

# 80 番（CloudFront から届く）で画面を返し、/api/ は API サーバーへ転送する
# EC2 の /etc/nginx/conf.d/kadai.conf に置く。default_server なので nginx.conf の既定の server より優先される
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # 画面（frontend の npm run build で作られる dist の中身）
    root /opt/kadai/www;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ブラウザと CloudFront の間は HTTPS だけにしている
        proxy_set_header X-Forwarded-Proto https;
    }

    # ファイル名に中身のハッシュが入っているので、ずっとキャッシュしてよい
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html などはデプロイのたびに変わるので、毎回 EC2 に確かめさせる
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

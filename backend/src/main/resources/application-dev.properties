# 開発用の設定。`.\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev` で起動したときだけ使う

# テーブル作成（db/migration）に加えて、テストデータ（db/testdata）も DB に入れる。
# 本番の DB にはテストデータを入れないよう、dev のときだけ読み込む
spring.flyway.locations=classpath:db/migration,classpath:db/testdata

# 後から db/migration に V2 などを足しても、テストデータ（V1.0.1）を入れられるようにする
spring.flyway.out-of-order=true

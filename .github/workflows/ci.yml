# コードチェックとテストを、Pull Request と main への push ごとに GitHub 上で実行する。
# 手元で同じことをするコマンドは README「テストとコードチェック」
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: 画面（lint・ユニットテスト・型チェック・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: API サーバー（書式・静的解析・テスト）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # テスト用の PostgreSQL は Testcontainers が Docker で起動する（ubuntu-latest には Docker が入っている）
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  terraform:
    name: Terraform（書式・構文・lint）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    # AWS には接続しない（plan・apply は手元で行う）
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -diff -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init
        env:
          # プラグインを GitHub から取るときの回数制限を避ける
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --format=compact
